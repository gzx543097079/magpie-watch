<script>
(()=>{'use strict';

const floor=new T.Group();scene.add(floor);

for(let z=-12;z<=53;z+=2){let g=new T.BufferGeometry().setFromPoints([new T.Vector3(-38,-5,z),new T.Vector3(38,-5,z)]);floor.add(new T.Line(g,new T.LineBasicMaterial({color:0x3b8b9f,transparent:true,opacity:.17})))}
const plinth=new T.Mesh(new T.CylinderGeometry(3.2,4.3,.26,96),new T.MeshBasicMaterial({color:0x08202b,transparent:true,opacity:.22,depthWrite:false}));plinth.position.set(0,-4.83,0);scene.add(plinth);
const floorRings=[];
for(let r of [3.3,4,4.8]){let mesh=new T.Mesh(new T.TorusGeometry(r,.018,5,128),emissive(r===3.3?palette.cyan:0x438196,.23));mesh.rotation.x=Math.PI/2;mesh.position.y=-4.61;scene.add(mesh);floorRings.push(mesh)}
const sweepRings=[];
for(let i=0;i<2;i++){let ring=new T.Mesh(new T.TorusGeometry(1,.026,5,96),emissive(palette.cyan,.16));ring.rotation.x=Math.PI/2;ring.position.set(0,-4.57,0);scene.add(ring);sweepRings.push(ring)}

const inner=new T.Mesh(new T.IcosahedronGeometry(.93,1),matte(0x78e4e9,{flatShading:true,emissive:0x30c8d9,emissiveIntensity:1.5,metalness:.4}));hub.add(inner);

const hoops=[];
for(let i=0;i<3;i++){let ring=new T.Mesh(new T.TorusGeometry(2.05+i*.46,.035,8,128),emissive(i===1?0xebac7e:0x78dae7,.48));ring.rotation.set(.35+i*.5,.2+i*.5,i*.64);hub.add(ring);hoops.push(ring)}
const orbiters=[];
for(let i=0;i<5;i++){let point=glow(hub,i%2?palette.orange:palette.cyan,.72,.52);orbiters.push(point)}
for(let i=0;i<16;i++){let a=i/16*Math.PI*2;let t=new T.Mesh(new T.BoxGeometry(.045,.36,.09),emissive(palette.cyan,.55));t.position.set(Math.cos(a)*2.92,Math.sin(a)*2.92,0);t.rotation.z=-a;hub.add(t)}
// 星港上方的体积尘埃，远中近三层带视差。
const stars=[];let rng=14352;function rand(){rng=(rng*1664525+1013904223)>>>0;return rng/4294967296}
for(let layer=0;layer<3;layer++){const count=[190,95,35][layer],positions=new Float32Array(count*3);for(let i=0;i<count;i++){positions[i*3]=(rand()-.5)*75;positions[i*3+1]=(rand()-.5)*38+5;positions[i*3+2]=-45+layer*20+rand()*12}let g=new T.BufferGeometry();g.setAttribute('position',new T.BufferAttribute(positions,3));let points=new T.Points(g,new T.PointsMaterial({color:layer===2?0xa3e1ef:0x7293af,size:[.065,.09,.15][layer],transparent:true,opacity:[.32,.48,.58][layer],sizeAttenuation:true,depthWrite:false}));scene.add(points);stars.push(points)}
const nodeGeo=new T.IcosahedronGeometry(1,1),shellGeo=new T.IcosahedronGeometry(1.24,1);
const nodes=new Map(), labels=document.getElementById('labels'), routes=new Map(), particles=[];
let pulseEnergy=0;const pulseBursts=[];
function burst(color,point){if(reduced)return;let mesh=new T.Mesh(new T.RingGeometry(.56,.62,48),emissive(color,.65));mesh.position.copy(point);mesh.rotation.x=-.32;scene.add(mesh);pulseBursts.push({mesh,age:0});pulseEnergy=Math.min(1.8,pulseEnergy+.65)}
const pipeMuted=emissive(0x4c8590,.13);
function posFor(side,index,n){let y=n===1?0:(n-1-2*index)*(n>5?4.8:3.6)/Math.max(1,n-1),x=side*(9.3+Math.abs(y)*.08),z=[-.6,.8,0,-.8,.5,-.3,.7,-.5][index%8];return new T.Vector3(x,y,z)}
function makeNode(data,side,index,total){let color=side<0?palette.cyan:palette.orange,g=new T.Group();let pos=posFor(side,index,total);g.position.copy(pos);scene.add(g);
 let size=.55+Math.min(1,Math.sqrt(Math.max(0,data.calls||0)/2200))*.47;
 let shell=new T.Mesh(shellGeo,matte(side<0?0x1c5261:0x5a392b,{wireframe:true,transparent:true,opacity:.32}));shell.scale.setScalar(size);g.add(shell);
 let solid=new T.Mesh(nodeGeo,matte(side<0?0x126476:0x7f5038,{emissive:color,emissiveIntensity:.14,flatShading:true}));solid.scale.setScalar(size*.68);g.add(solid);
 let light=glow(g,color,size*4,.43);
 let torus=new T.Mesh(ringGeo,emissive(color,.63));torus.scale.setScalar(size*1.35);torus.rotation.x=.68;g.add(torus);
 let leader=new T.Mesh(new T.CylinderGeometry(.008,.008,Math.abs(pos.y+4.6),4),emissive(color,.15));leader.position.set(0,(-4.6-pos.y)/2,0);g.add(leader);

function control(a,b){let sign=Math.sign(b.x-a.x),lift=Math.abs(a.y-b.y)*.12;return [a.clone(),new T.Vector3(a.x+sign*2,a.y+lift,a.z+1.2),new T.Vector3(b.x-sign*2,b.y+lift,b.z+1),b.clone()]}

const known=new Set();let data={agents:[],models:[],flows:[],online:false,calls:0,errors:0,pet:true};
window.setMagpieData=function(next){if(!next || typeof next!=='object')return;data={...data,...next};reconcile(Array.isArray(data.agents)?data.agents:[],-1);reconcile(Array.isArray(data.models)?data.models:[],1);rebuildPipes();refreshLabels();const flows=data.online&&Array.isArray(data.flows)?data.flows:[];const current=new Set(flows.map(flow=>flow.id));for(let i=particles.length-1;i>=0;i--)if(!current.has(particles[i].id)){clearParticle(particles[i]);particles.splice(i,1)}for(const flow of flows){let p=particles.find(p=>p.id===flow.id);if(!known.has(flow.id)){known.add(flow.id);spawn(flow)}else if(p&&flow.stage==='returning'&&!p.done){p.stage='returning';p.outcome=flow.outcome||'ok';p.status=flow.statusCode||0;p.age=p.outcome==='rateLimited'?2.1:p.outcome==='ok'?5.2:4.9;p.done=true;p.mesh.material.color.setHex(p.outcome==='ok'?palette.white:palette.red);p.light.material.color.setHex(p.outcome==='ok'?palette.cyan:palette.red);p.trail.forEach(spark=>spark.material.color.setHex(p.outcome==='ok'?palette.orange:palette.red));burst(p.outcome==='ok'?palette.orange:palette.red,p.outcome==='rateLimited'?hub.position:nodes.get(p.model)?.g.position||hub.position)}}if(known.size>500){const oldest=[...known].slice(0,known.size-300);oldest.forEach(id=>known.delete(id))}
 document.getElementById('status').classList.toggle('offline',!data.online);document.getElementById('statusText').textContent=data.online?'本地网关在线':'本地网关离线 · 等待重连';document.getElementById('calls').textContent=data.calls==null?'—':Number(data.calls).toLocaleString();document.getElementById('models').textContent=(data.models||[]).length||'—';document.getElementById('errors').textContent=data.errors==null?'—':Number(data.errors).toLocaleString();document.getElementById('pet').style.display=data.pet===false?'none':'block';if(!flows.length&&!particles.length){document.getElementById('message').textContent=data.online?'当前无在途请求':'网关离线 · 等待重连'}
};
function notify(text,error=false){const msg=document.getElementById('message');msg.innerHTML='<b></b>';msg.firstChild.textContent=text;msg.classList.toggle('error',error);const bubble=document.getElementById('pet-bubble');bubble.textContent=error?'呀，路由出问题了…':'请求正在回流～';bubble.classList.add('show');clearTimeout(notify.timer);notify.timer=setTimeout(()=>bubble.classList.remove('show'),3400)}
function clearNode(n){scene.remove(n.g);n.label.remove();n.g.traverse(o=>{if(o.material)o.material.dispose()});nodes.delete(n.id)}
function refreshLabels(){const total=Math.max(1,(data.models||[]).reduce((sum,o)=>sum+(o.calls||0),0));for(const n of nodes.values()){let b=n.label.querySelector('b'),s=n.label.querySelector('small');if(!b){b=document.createElement('b');s=document.createElement('small');n.label.append(b,s)}b.textContent=n.name;s.textContent=n.sub?n.sub+' · ':'';let num=s.querySelector('.num');if(!num){num=document.createElement('span');num.className='num';s.append(num)}num.textContent=n.side<0?Number(n.calls).toLocaleString()+' 次':n.calls?Math.round(n.calls/total*100)+'%':'等待'}}
function decorate(t,delta){pulseEnergy=Math.max(0,pulseEnergy-delta*.65);hub.rotation.y=t*.24;hub.rotation.z=Math.sin(t*.22)*.085;inner.rotation.y=-t*.64;inner.rotation.x=t*.2;cage.rotation.y=t*.17;cage.material.emissiveIntensity=.55+Math.sin(t*1.8)*.22+pulseEnergy*.5;gatewayHalo.material.opacity=.3+Math.sin(t*1.8)*.09+pulseEnergy*.16;hoops.forEach((o,i)=>{o.rotation.x=.35+i*.5+Math.sin(t*.55+i)*.32;o.rotation.y=t*(i%2?.26:-.32);o.material.opacity=.39+Math.sin(t*2+i)*.11+pulseEnergy*.14});orbiters.forEach((o,i)=>{let a=t*(i%2?-.55:.7)+i*Math.PI*2/5,r=2.3+i%3*.32;o.position.set(Math.cos(a)*r,Math.sin(a*1.2+i)*r*.64,Math.sin(a)*r*.55);o.material.opacity=.38+.18*Math.sin(t*3+i)});floorRings.forEach((r,i)=>r.material.opacity=.16+Math.sin(t*1.2-i)*.07+pulseEnergy*.09);sweepRings.forEach((r,i)=>{let phase=(t*.24+i*.5)%1;r.scale.setScalar(1.15+phase*4.3);r.material.opacity=(1-phase)*(.13+pulseEnergy*.12)});for(let i=pulseBursts.length-1;i>=0;i--){let burst=pulseBursts[i];burst.age+=delta;burst.mesh.scale.setScalar(1+burst.age*3.8);burst.mesh.material.opacity=Math.max(0,.65-burst.age*.85);if(burst.age>.8){scene.remove(burst.mesh);burst.mesh.geometry.dispose();burst.mesh.material.dispose();pulseBursts.splice(i,1)}}stars.forEach((s,i)=>{s.rotation.y=Math.sin(t*.12+i)*.035;s.position.x=Math.sin(t*.08+i*2)*(.2+i*.15)});
 for(const n of nodes.values()){n.g.position.lerp(n.target,Math.min(1,delta*2.5));n.g.position.y+=Math.sin(t*1.25+n.index*1.4+(n.side<0?0:1))*.0025;n.g.rotation.y+=delta*(n.side<0?.35:-.31);n.torus.rotation.z=t*.41+n.index;n.light.material.opacity=.29+.15*Math.sin(t*1.8+n.index)+pulseEnergy*.06;n.solid.material.emissiveIntensity=.13+.08*Math.sin(t*1.8+n.index);n.opacity+=(n.alive?1:-1)*Math.min(1,delta*2);n.opacity=Math.min(1,Math.max(0,n.opacity));n.label.style.opacity=n.opacity.toFixed(2);n.label.classList.toggle('dim',n.calls===0);if(!n.alive&&n.opacity<=.01)clearNode(n)}
 for(const r of routes.values()){r.brightness=Math.max(0,r.brightness-delta*.9);let breath=.5+.5*Math.sin(t*1.45+r.index*1.7);r.base.material.opacity=.12+breath*.075+r.brightness*.44;r.glow.material.opacity=.035+breath*.075+r.brightness*.23;r.motes.forEach((m,i)=>{let u=(t*(.065+r.brightness*.09)+i/3+r.index*.17)%1;m.position.copy(r.curve.getPoint(u));m.material.opacity=(.14+breath*.13+r.brightness*.3)*Math.sin(Math.PI*u);m.scale.setScalar(.35+r.brightness*.2)})}
 let active=0;for(let i=particles.length-1;i>=0;i--){let p=particles[i],a=nodes.get(p.agent),m=nodes.get(p.model);if(!a||!m||!a.alive||!m.alive){clearParticle(p);particles.splice(i,1);continue}p.age+=delta;let age=p.age;if(age>13){clearParticle(p);particles.splice(i,1);continue}let left=routes.get(a.id),right=routes.get(m.id);if(!left||!right)continue;let point,leg;
 if(!p.done && age>=5.15){p.age=4.45;age=4.45}
 if(age<1.8){leg='in';point=left.curve.getPoint(Math.min(1,age/1.8));left.brightness=1}
 else if(age<2.5){leg='hub';point=hub.position.clone();point.y+=Math.sin(t*3+p.age)*.18}
 else if(p.done && p.outcome==='rateLimited'){let u=Math.min(1,(age-2.5)/1.7);leg='returnAgent';point=left.curve.getPoint(1-u);left.brightness=1}
 else if(age<4){leg='out';point=right.curve.getPoint(Math.min(1,(age-2.5)/1.5));right.brightness=1}
 else if(age<5.2){leg='wait';point=m.g.position.clone();point.y+=.4+Math.sin(t*4)*.12;right.brightness=.8}
 else if(age<7){leg='returnModel';point=right.curve.getPoint(Math.max(0,1-(age-5.2)/1.8));right.brightness=1}
 else {leg='returnAgent';point=left.curve.getPoint(Math.max(0,1-(age-7)/1.7));left.brightness=1}
 if(p.done&&p.outcome!=='ok'){let r=p.outcome==='rateLimited'?left:right;r.glow.material.color.setHex(p.outcome==='timedOut'?0x7e9ca8:palette.red);r.brightness=1}
 if(leg!==p.lastLeg){if(leg==='hub'||leg==='wait'||leg==='returnAgent')burst(p.done&&p.outcome!=='ok'?palette.red:leg==='wait'?palette.orange:palette.cyan,leg==='wait'?m.g.position:hub.position);if(p.done && p.outcome!=='ok' && (leg==='returnModel'||leg==='returnAgent')){notify(p.outcome==='timedOut'?'上游超时 · 响应已回传':p.outcome==='rateLimited'?'429 · 网关限流':p.outcome==='disconnected'?'连接中断 · 路由已记录':`${p.status||'上游'} · 请求失败`,true)}else if(leg==='returnModel' && p.done)notify('模型响应已沿原路返回');p.lastLeg=leg}
 p.mesh.position.copy(point);p.trail.forEach((spark,i)=>{let offset=(i+1)*.075,u;if(leg==='in')u=Math.max(0,age/1.8-offset);else if(leg==='out')u=Math.max(0,(age-2.5)/1.5-offset);else if(leg==='returnModel')u=Math.min(1,1-(age-5.2)/1.8+offset);else if(leg==='returnAgent')u=Math.min(1,1-(p.outcome==='rateLimited'?(age-2.5)/1.7:(age-7)/1.7)+offset);spark.position.copy(leg==='in'||leg==='returnAgent'?left.curve.getPoint(u):leg==='out'||leg==='returnModel'?right.curve.getPoint(u):point);spark.material.opacity=(leg==='hub'||leg==='wait'?.07:.44)*(1-i/7);spark.scale.setScalar(.74-i*.085)});p.mesh.scale.setScalar(p.done&&p.outcome!=='ok'?.77:1);p.light.scale.setScalar(1.3+Math.sin(t*6)*.22);active++;if(age>(p.outcome==='rateLimited'&&p.done?4.2:8.8)){clearParticle(p);particles.splice(i,1)}}
 document.getElementById('active').textContent=active;
}
function placeLabels(){const width=innerWidth,height=innerHeight;for(const n of nodes.values()){const v=n.g.position.clone().project(camera);let x=(v.x*.5+.5)*width,y=(-v.y*.5+.5)*height;let margin=Math.max(115,width*.06);x=Math.max(margin,Math.min(width-margin,x));let depth=Math.max(.78,Math.min(1.32,1.12-n.g.position.z*.025));let dx=n.side<0?-82:82;n.label.style.left=(x+dx)+'px';n.label.style.top=Math.max(height*.23,Math.min(height*.83,y))+'px';n.label.style.fontSize=(12*depth)+'px'}}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));placeLabels()}window.addEventListener('resize',resize);
function frame(){requestAnimationFrame(frame);let delta=Math.min(clock.getDelta(),.05);let t=performance.now()/1000;if(reduced)delta=0;camera.position.x=reduced?0:Math.sin(t*.12)*1.25;camera.position.y=reduced?7:7+Math.sin(t*.08)*.35;camera.lookAt(0,0,0);decorate(t,delta);placeLabels();renderer.render(scene,camera)}
if(demo){document.getElementById('demo').classList.add('on');let demoAgents=['Claude Code','Claude Desktop','Codex','Cursor','Raycast'],demoModels=['claude-opus-5','gpt-6-sol','deepseek-v4.1-flash','gemini-pro','qwen-max'];let demoData={agents:demoAgents.map((name,i)=>({id:'a'+i,name,calls:[3142,1246,885,488,219][i],sub:'今日调用'})),models:demoModels.map((name,i)=>({id:'m'+i,name,calls:[3516,1940,1543,670,310][i],sub:['Anthropic','OpenAI','DeepSeek','Google','Alibaba'][i]})),flows:[],online:true,calls:7619,errors:19,pet:true};window.setMagpieData(demoData);let sequence=0;function demoTick(){let i=sequence%5,flow={id:'sample'+sequence,agentID:'a'+i, destinationID:'m'+((i+sequence)%5),stage:'incoming',outcome:'ok'};demoData.flows=[flow];window.setMagpieData(demoData);setTimeout(()=>{flow.stage='returning';flow.outcome=sequence%7===0?'rateLimited':sequence%11===0?'timedOut':'ok';window.setMagpieData(demoData)},4000);sequence++;}demoTick();if(!shot)setInterval(demoTick,3200)}
frame();if(shot){setTimeout(()=>{document.title='ready'},1000)}
})();
